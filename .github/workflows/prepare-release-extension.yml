# Consumer-owned (seeded by vigOS devkit; upgrades never overwrite this file).
# Bugs / missing tools: https://github.com/vig-os/devkit/issues
#
# Stamps the release version into the single version source
# (packages/cli/package.json, ADR-0021, #201) on release/X.Y.Z, so the commit
# every X.Y.Z-rcN candidate and the final X.Y.Z tag point at already carries
# X.Y.Z. A candidate therefore reports the base X.Y.Z (plus its build revision);
# a final reports exactly X.Y.Z.

name: Prepare Release Extension

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      version:
        description: "Release version being prepared (X.Y.Z)"
        required: true
        type: string
      release_branch:
        description: "Release branch just created (release/X.Y.Z)"
        required: true
        type: string
      branch_sha:
        description: "Post-freeze head SHA the release branch was created from"
        required: true
        type: string
      dry_run:
        description: "Validate without making changes (extensions must honor it)"
        required: false
        default: false
        type: boolean

# The orchestrator calls this workflow with `secrets: inherit`, so the COMMIT_APP
# token can push to the write-protected release branch — the same bypass the
# changelog-freeze commit already uses.
permissions:
  contents: read

jobs:
  extension:
    name: Stamp release version
    runs-on: ubuntu-26.04
    steps:
      - name: Generate Commit App Token
        id: commit_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.COMMIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_APP_PRIVATE_KEY }}

      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.branch_sha }}

      - name: Stamp version into packages/cli/package.json
        id: stamp
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          result=$(node scripts/set-release-version.mjs "$VERSION" "${flags[@]}")
          echo "stamp result: $result"
          if [ "$result" = "changed" ] && [ "$DRY_RUN" != "true" ]; then
            echo "commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the stamped version to the release branch via API
        if: ${{ steps.stamp.outputs.commit == 'true' }}
        uses: vig-os/commit-action@7ba7e1ae17547813e708d4cc6a771a09f978f724  # v0.3.3
        env:
          GH_TOKEN: ${{ steps.commit_app_token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: refs/heads/${{ inputs.release_branch }}
          MAX_ATTEMPTS: "3"
          COMMIT_MESSAGE: |-
            chore: set release version ${{ inputs.version }}

            Stamp ${{ inputs.version }} into packages/cli/package.json, the single
            version source (ADR-0021).
          FILE_PATHS: packages/cli/package.json
