# revkit flake outputs — build + template smoke (D1, ADR-0010, M5).
#
# Verifies the M5 acceptance criteria on every PR touching the flake or
# the CLI:
#   1. `nix build .#revkit` produces a reproducible CLI store path.
#   2. `bin/revkit --help` and `bin/revkit --version` run outside the
#      repo (proves the wrapper resolves its own libexec).
#   3. `scripts/template-smoke.sh` scaffolds `templates.default` into a
#      temp dir, runs `nix build` and `revkit check` in it, boots
#      `revkit serve` on 127.0.0.1, probes it, and tears it down.
#
# ADR-0014 secret discipline:
#   - `pull_request` only, NEVER `pull_request_target` (a PR from a
#     fork cannot mint tokens or read secrets).
#   - `contents: read` is the only permission — the flake build reads
#     the tree; nothing writes back.
#   - No environment secrets are used or exposed.
#
# The devkit-managed `ci.yml` does not build with nix (its lanes are
# `just precommit` and `just test`), so this consumer-owned workflow
# lives beside `revkit-guards.yml` as its M5 sibling: guards for the
# authoring surface, flake for the distribution surface.
#
# Outside `CI Summary` for the same reason `revkit-guards` is — until
# vig-os/devkit#1761 exposes a hook that folds a custom check into the
# managed summary gate. Branch protection references this workflow by
# name once M5 lands (a follow-up chore, not part of this PR).
name: revkit-flake

"on":
  pull_request:
    branches: [dev, main]

concurrency:
  group: revkit-flake-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: nix build .#revkit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix (upstream CppNix, flakes enabled)
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build revkit package
        # `.#revkit` and `.#default` should be the same drv; the second
        # build is a store-hit and cheap. `--print-out-paths` is the
        # evidence we want in the log.
        run: |
          set -euxo pipefail
          nix build .#revkit --no-link --print-out-paths
          nix build .#default --no-link --print-out-paths

      - name: Smoke — --version and --help outside the repo
        # Runs from `/tmp` so a relative-import bug in the wrapper would
        # be caught. Both must succeed with exit 0.
        run: |
          set -euxo pipefail
          store=$(nix build .#revkit --no-link --print-out-paths)
          cd /tmp
          "$store/bin/revkit" --version
          "$store/bin/revkit" --help | head -5

  template-smoke:
    name: templates.default end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix (upstream CppNix, flakes enabled)
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run template smoke
        # Scaffolds the template into a temp dir, uses --override-input
        # to point at THIS checkout, runs revkit check, nix build, and
        # serve. `scripts/template-smoke.sh` traps EXIT so no daemon
        # leaks on failure.
        run: bash scripts/template-smoke.sh "${GITHUB_WORKSPACE}"
